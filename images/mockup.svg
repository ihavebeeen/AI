<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="600" height="400" rx="16" fill="#FFFFFF"/>
    
    <!-- Header -->
    <rect x="20" y="20" width="560" height="60" rx="8" fill="#F8F9FA"/>
    <circle cx="50" cy="50" r="15" fill="#4A90E2"/>
    <rect x="80" y="40" width="100" height="20" rx="4" fill="#2C3E50"/>
    <rect x="360" y="40" width="60" height="20" rx="4" fill="#E1E1E1"/>
    <rect x="440" y="40" width="60" height="20" rx="4" fill="#E1E1E1"/>
    <rect x="520" y="40" width="40" height="20" rx="4" fill="#E1E1E1"/>
    
    <!-- Main Content -->
    <rect x="40" y="100" width="240" height="40" rx="4" fill="#2C3E50"/>
    <rect x="40" y="150" width="180" height="20" rx="4" fill="#666666"/>
    
    <!-- Cards Grid -->
    <rect x="40" y="200" width="160" height="180" rx="8" fill="#F8F9FA"/>
    <rect x="220" y="200" width="160" height="180" rx="8" fill="#F8F9FA"/>
    <rect x="400" y="200" width="160" height="180" rx="8" fill="#F8F9FA"/>
    
    <!-- Card Content -->
    <rect x="60" y="220" width="120" height="80" rx="4" fill="#4A90E2" fill-opacity="0.1"/>
    <rect x="60" y="320" width="80" height="12" rx="2" fill="#2C3E50"/>
    <rect x="60" y="340" width="120" height="8" rx="2" fill="#666666"/>
    
    <rect x="240" y="220" width="120" height="80" rx="4" fill="#4A90E2" fill-opacity="0.1"/>
    <rect x="240" y="320" width="80" height="12" rx="2" fill="#2C3E50"/>
    <rect x="240" y="340" width="120" height="8" rx="2" fill="#666666"/>
    
    <rect x="420" y="220" width="120" height="80" rx="4" fill="#4A90E2" fill-opacity="0.1"/>
    <rect x="420" y="320" width="80" height="12" rx="2" fill="#2C3E50"/>
    <rect x="420" y="340" width="120" height="8" rx="2" fill="#666666"/>
    
    <!-- Decorative Elements -->
    <circle cx="100" cy="260" r="20" fill="#4A90E2" fill-opacity="0.2"/>
    <circle cx="280" cy="260" r="20" fill="#4A90E2" fill-opacity="0.2"/>
    <circle cx="460" cy="260" r="20" fill="#4A90E2" fill-opacity="0.2"/>
</svg> 